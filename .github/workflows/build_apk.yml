name: HakPay Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          cache: true

      - name: Klasor Yapisini Duzelt
        run: |
          mkdir -p lib/config
          mkdir -p lib/core
          mkdir -p lib/ui/widgets
          mkdir -p lib/repositories
          mkdir -p lib/services
          mkdir -p assets

          [ -f main.dart ] && mv -f main.dart lib/main.dart || true
          [ -f splash_screen.dart ] && mv -f splash_screen.dart lib/ui/ || true
          [ -f legacy_app.dart ] && mv -f legacy_app.dart lib/ui/ || true
          [ -f theme.dart ] && mv -f theme.dart lib/ui/ || true
          [ -f app_config.dart ] && mv -f app_config.dart lib/config/ || true
          [ -f result.dart ] && mv -f result.dart lib/core/ || true
          [ -f catalog_repository.dart ] && mv -f catalog_repository.dart lib/repositories/ || true
          [ -f glass_card.dart ] && mv -f glass_card.dart lib/ui/widgets/ || true

          for f in \
            ad_service.dart \
            api_client.dart \
            auth_service.dart \
            billing_service.dart \
            callback_verify.dart \
            notification_service.dart \
            service_locator.dart \
            streak_referral_service.dart \
            wallet_service.dart \
            withdrawal_service.dart \
            admob_ad_service.dart
          do
            [ -f "$f" ] && mv -f "$f" lib/services/ || true
          done

      - name: Eski Flutter Color API Hatalarini Duzelt
        run: |
          python3 <<'PY'
          import os
          import re

          root = "lib"

          for dirpath, _, filenames in os.walk(root):
              for filename in filenames:
                  if not filename.endswith(".dart"):
                      continue

                  path = os.path.join(dirpath, filename)

                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()

                  original = content

                  content = re.sub(
                      r'\.withValues\s*\(\s*alpha\s*:\s*([^)]+)\)',
                      r'.withOpacity(\1)',
                      content
                  )

                  content = content.replace(
                      ".with0pacity(",
                      ".withOpacity("
                  )

                  content = re.sub(
                      r'\.\.withOpacity\(',
                      r'.withOpacity(',
                      content
                  )

                  if content != original:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)

                      print("Duzeltildi:", path)
          PY

      - name: Uyumsuz Kod Kontrolu
        run: |
          if grep -RIn --include="*.dart" "withValues" lib; then
            echo "HATA: withValues hala mevcut."
            exit 1
          fi

          if grep -RIn --include="*.dart" "with0pacity" lib; then
            echo "HATA: with0pacity hala mevcut."
            exit 1
          fi

      - name: Eksik Logo Assetini Olustur
        run: |
          mkdir -p assets

          if [ ! -f assets/hakpay_logo.png ]; then
            echo "Eksik hakpay_logo.png bulunamadi. Gecici PNG olusturuluyor."

            python3 <<'PY'
          import struct
          import zlib

          width = 1
          height = 1

          raw = b'\x00\x00\x00\x00'
          compressed = zlib.compress(raw)

          def chunk(name, data):
              crc = zlib.crc32(name + data) & 0xffffffff
              return (
                  struct.pack(">I", len(data))
                  + name
                  + data
                  + struct.pack(">I", crc)
              )

          png = b'\x89PNG\r\n\x1a\n'

          png += chunk(
              b'IHDR',
              struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
          )

          png += chunk(b'IDAT', compressed)
          png += chunk(b'IEND', b'')

          with open("assets/hakpay_logo.png", "wb") as f:
              f.write(png)
          PY
          fi

      - name: Sifir Android Altyapisi Olustur
        run: |
          rm -rf android

          flutter create . \
            --project-name hakpay \
            --org com.hakpay \
            --platforms=android

      - name: Flutter Temizle
        run: |
          flutter clean

      - name: Bagimliliklari Yukle
        run: |
          flutter pub get

      - name: Sadece Uygulama Kodunu Analiz Et
        run: |
          flutter analyze lib

      - name: APK Derle
        run: |
          flutter build apk --release

      - name: APK Artifact Yukle
        uses: actions/upload-artifact@v4
        with:
          name: hakpay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
