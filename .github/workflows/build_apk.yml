name: HakPay Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build HakPay APK
    runs-on: ubuntu-latest

    steps:
      # 1. Kodu indir
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: true

      # 3. Projenin mevcut yapısını KORU
      - name: Check Project
        run: |
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Dart files:"
          find lib -type f -name "*.dart" | sort

          echo ""
          echo "Main:"
          if [ -f lib/main.dart ]; then
            echo "lib/main.dart bulundu"
          else
            echo "HATA: lib/main.dart bulunamadi"
            exit 1
          fi

          echo ""
          echo "Pubspec:"
          if [ -f pubspec.yaml ]; then
            echo "pubspec.yaml bulundu"
          else
            echo "HATA: pubspec.yaml bulunamadi"
            exit 1
          fi

      # 4. Paketleri yükle
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # 5. Dart analyzer
      # Info seviyesindeki mesajlar build'i durdurmasin.
      - name: Dart Analyze
        run: |
          flutter analyze --no-fatal-infos
        continue-on-error: false

      # 6. APK
      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      # 7. APK'yi yükle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hakpay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
