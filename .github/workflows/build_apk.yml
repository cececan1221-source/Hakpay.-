name: HakPay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build HakPay APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: true


      # --------------------------------------------------
      # 3. Flutter version check
      # --------------------------------------------------
      - name: Flutter Version
        run: |
          flutter --version
          dart --version


      # --------------------------------------------------
      # 4. Project folders
      # --------------------------------------------------
      - name: Prepare Project
        run: |
          mkdir -p lib
          mkdir -p lib/config
          mkdir -p lib/core
          mkdir -p lib/services
          mkdir -p lib/repositories
          mkdir -p lib/ui
          mkdir -p lib/ui/widgets
          mkdir -p assets
          mkdir -p test


      # --------------------------------------------------
      # 5. Move old root files
      # --------------------------------------------------
      - name: Normalize Project Files
        run: |

          # main.dart
          if [ -f main.dart ]; then
            mv -f main.dart lib/main.dart
          fi

          # UI files
          if [ -f splash_screen.dart ]; then
            mv -f splash_screen.dart lib/ui/splash_screen.dart
          fi

          if [ -f legacy_app.dart ]; then
            mv -f legacy_app.dart lib/ui/legacy_app.dart
          fi

          if [ -f theme.dart ]; then
            mv -f theme.dart lib/ui/theme.dart
          fi

          # Config
          if [ -f app_config.dart ]; then
            mv -f app_config.dart lib/config/app_config.dart
          fi

          # Core
          if [ -f result.dart ]; then
            mv -f result.dart lib/core/result.dart
          fi

          # Repository
          if [ -f catalog_repository.dart ]; then
            mv -f catalog_repository.dart lib/repositories/catalog_repository.dart
          fi

          # Widgets
          if [ -f glass_card.dart ]; then
            mv -f glass_card.dart lib/ui/widgets/glass_card.dart
          fi

          # Services
          for f in \
            ad_service.dart \
            api_client.dart \
            auth_service.dart \
            billing_service.dart \
            callback_verify.dart \
            notification_service.dart \
            service_locator.dart \
            streak_referral_service.dart \
            wallet_service.dart \
            withdrawal_service.dart \
            admob_ad_service.dart
          do
            if [ -f "$f" ]; then
              mv -f "$f" "lib/services/$f"
            fi
          done


      # --------------------------------------------------
      # 6. Remove duplicate legacy service
      # --------------------------------------------------
      - name: Remove Duplicate Withdrawal Service
        run: |

          if [ -f lib/withdrawal_service.dart ]; then

            cat > lib/withdrawal_service.dart <<'EOF'
          // Compatibility export.
          //
          // The actual implementation is located at:
          // lib/services/withdrawal_service.dart

          export 'services/withdrawal_service.dart';
          EOF

          fi


      # --------------------------------------------------
      # 7. Verify project structure
      # --------------------------------------------------
      - name: Verify Project
        run: |

          echo "========== PROJECT =========="
          find lib -maxdepth 3 -type f | sort

          echo ""
          echo "========== MAIN =========="

          if [ ! -f lib/main.dart ]; then
            echo "ERROR: lib/main.dart bulunamadı."
            exit 1
          fi

          echo "OK: lib/main.dart"


      # --------------------------------------------------
      # 8. Flutter pubspec
      # --------------------------------------------------
      - name: Check Pubspec
        run: |

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml bulunamadı."
            exit 1
          fi

          flutter pub get


      # --------------------------------------------------
      # 9. Analyze
      # --------------------------------------------------
      - name: Dart Analyze
        run: |

          dart analyze --fatal-infos


      # --------------------------------------------------
      # 10. Tests
      # --------------------------------------------------
      - name: Run Tests
        run: |

          if [ -d test ] && find test -type f -name "*.dart" | grep -q .; then
            flutter test
          else
            echo "Test dosyası yok, test adımı atlandı."
          fi


      # --------------------------------------------------
      # 11. Build APK
      # --------------------------------------------------
      - name: Build Release APK
        run: |

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --no-tree-shake-icons


      # --------------------------------------------------
      # 12. Verify APK
      # --------------------------------------------------
      - name: Check APK
        run: |

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK oluşturulamadı."
            exit 1
          fi

          echo "APK başarıyla oluşturuldu:"
          ls -lh "$APK"


      # --------------------------------------------------
      # 13. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hakpay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
