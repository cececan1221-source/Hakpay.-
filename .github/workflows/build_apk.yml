name: HakPay Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          cache: true

      - name: Klasorleri Hazirla
        run: |
          mkdir -p lib/config
          mkdir -p lib/core
          mkdir -p lib/ui/widgets
          mkdir -p lib/repositories
          mkdir -p lib/services
          mkdir -p assets

          [ -f main.dart ] && mv -f main.dart lib/main.dart || true
          [ -f splash_screen.dart ] && mv -f splash_screen.dart lib/ui/ || true
          [ -f legacy_app.dart ] && mv -f legacy_app.dart lib/ui/ || true
          [ -f theme.dart ] && mv -f theme.dart lib/ui/ || true
          [ -f app_config.dart ] && mv -f app_config.dart lib/config/ || true
          [ -f result.dart ] && mv -f result.dart lib/core/ || true
          [ -f catalog_repository.dart ] && mv -f catalog_repository.dart lib/repositories/ || true
          [ -f glass_card.dart ] && mv -f glass_card.dart lib/ui/widgets/ || true

          for f in \
            ad_service.dart \
            api_client.dart \
            auth_service.dart \
            billing_service.dart \
            callback_verify.dart \
            notification_service.dart \
            service_locator.dart \
            streak_referral_service.dart \
            wallet_service.dart \
            withdrawal_service.dart \
            admob_ad_service.dart
          do
            [ -f "$f" ] && mv -f "$f" lib/services/ || true
          done

      - name: Flutter Eski Color API Duzeltmeleri
        run: |
          python3 <<'PY'
          import os
          import re

          for root, dirs, files in os.walk("lib"):
              for file in files:
                  if not file.endswith(".dart"):
                      continue

                  path = os.path.join(root, file)

                  with open(path, "r", encoding="utf-8") as f:
                      text = f.read()

                  original = text

                  # Flutter 3.24 uyumlulugu
                  text = re.sub(
                      r'\.withValues\s*\(\s*alpha\s*:\s*([^)]+)\)',
                      r'.withOpacity(\1)',
                      text
                  )

                  # Yazim hatalarini duzelt
                  text = text.replace(
                      ".with0pacity(",
                      ".withOpacity("
                  )

                  text = text.replace(
                      "..withOpacity(",
                      ".withOpacity("
                  )

                  if text != original:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(text)

                      print("Duzeltildi:", path)
          PY

      - name: Eksik Logo Kontrolu
        run: |
          if [ ! -f assets/hakpay_logo.png ]; then
            echo "Uyari: assets/hakpay_logo.png bulunamadi."
            echo "APK build asamasinda kullaniliyorsa hata gorulecektir."
          fi

      - name: Android Projesini Yenile
        run: |
          rm -rf android

          flutter create . \
            --project-name hakpay \
            --org com.hakpay \
            --platforms=android

      - name: Flutter Temizle
        run: |
          flutter clean

      - name: Paketleri Yukle
        run: |
          flutter pub get

      - name: APK Derle
        run: |
          flutter build apk --release

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: hakpay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
