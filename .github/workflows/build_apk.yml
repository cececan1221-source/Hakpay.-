name: HakPay Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          cache: true

      - name: Klasor Yapisini ve Importlari Duzelt
        run: |
          mkdir -p lib/config lib/core lib/ui/widgets lib/repositories lib/services assets test
          [ -f main.dart ] && mv -f main.dart lib/main.dart || true
          [ -f splash_screen.dart ] && mv -f splash_screen.dart lib/ui/ || true
          [ -f legacy_app.dart ] && mv -f legacy_app.dart lib/ui/ || true
          [ -f theme.dart ] && mv -f theme.dart lib/ui/ || true
          [ -f app_config.dart ] && mv -f app_config.dart lib/config/ || true
          [ -f result.dart ] && mv -f result.dart lib/core/ || true
          [ -f catalog_repository.dart ] && mv -f catalog_repository.dart lib/repositories/ || true
          [ -f glass_card.dart ] && mv -f glass_card.dart lib/ui/widgets/ || true
          for f in ad_service.dart api_client.dart auth_service.dart billing_service.dart callback_verify.dart notification_service.dart service_locator.dart streak_referral_service.dart wallet_service.dart withdrawal_service.dart admob_ad_service.dart; do
            [ -f "$f" ] && mv -f "$f" lib/services/ || true
          done

      - name: Sifir Android Altyapisi Olustur (Gradle Hatasini Cozer)
        run: |
          rm -rf android
          flutter create . --project-name hakpay --org com.hakpay --platforms=android

      - name: APK Derle
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hakpay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
